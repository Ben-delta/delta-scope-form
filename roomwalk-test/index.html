<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retired: Delta Scope App room-walk v1</title>
<noscript><meta http-equiv="refresh" content="0;url=https://ben-delta.github.io/delta-scope-form/roomwalk-test-v4/"></noscript>
<style>body{font:17px -apple-system,Segoe UI,Arial,sans-serif;margin:24px;color:#1f2a37}button,a.b{display:inline-block;font-size:17px;padding:12px 16px;margin:8px 8px 0 0;border-radius:8px;border:1px solid #1f4e8c;background:#1f4e8c;color:#fff;text-decoration:none}a.l{color:#1f4e8c}.hide{display:none}</style></head><body>
<p id="msg">This version is retired. Opening the current Scope App (v4)…</p>
<div id="bk" class="hide"><p>Jobs from the older version are saved on this device. The Scope App (v4) brings them in by itself. For safety, download a backup first. You can open it in v4 with <b>Open project file</b>.</p>
<button id="dl" type="button">Download my saved jobs</button><a class="b" id="go" href="https://ben-delta.github.io/delta-scope-form/roomwalk-test-v4/" style="background:#fff;color:#1f4e8c">Continue to v4</a></div>
<p><a class="l" href="https://ben-delta.github.io/delta-scope-form/roomwalk-test-v4/">Open the current Scope App (v4)</a></p>
<script>
(function(){var V4="https://ben-delta.github.io/delta-scope-form/roomwalk-test-v4/";
var RW=["delta-roomwalk-test-v1","delta-roomwalk-test-v2","delta-roomwalk-test-v3"],DBS=["delta-roomwalk-v2-img","delta-roomwalk-v3-img"],keys={};
function go(){location.replace(V4);}
try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i),v=localStorage.getItem(k);
  if(RW.indexOf(k)>=0){try{var o=JSON.parse(v);if(o&&o.entries&&(o.entries.length||(o.rooms||[]).length))keys[k]=v;}catch(e){}}
  else if(k.indexOf("delta-l2-v13-")===0)keys[k]=v;}}catch(e){}
var has=Object.keys(keys).some(function(k){return k.indexOf("delta-l2-v13-p:")===0||RW.indexOf(k)>=0;});
if(!has)return go();
document.getElementById("msg").textContent="This version is retired. The current Scope App is v4.";
document.getElementById("bk").className="";
function readDb(name,cb){var out={};try{var r=indexedDB.open(name);r.onsuccess=function(){var d=r.result;if(!d.objectStoreNames.contains("img")){d.close();return cb(out);}var c=d.transaction("img").objectStore("img").openCursor();c.onsuccess=function(){var x=c.result;if(x){out[x.key]=x.value;x.continue();}else{d.close();cb(out);}};c.onerror=function(){cb(out);};};r.onerror=function(){cb(out);};}catch(e){cb(out);}}
document.getElementById("dl").onclick=function(){var b=this;b.disabled=true;b.textContent="Preparing…";var imgs={},n=DBS.length;
  DBS.forEach(function(name){readDb(name,function(o){if(Object.keys(o).length)imgs[name]=o;if(--n===0)fin();});});
  function fin(){var data=JSON.stringify({kind:"delta-scope-backup",v:1,from:location.pathname,created:new Date().toISOString(),keys:keys,images:imgs});
    var d=new Date(),nm="Delta_Scope_Backup_"+d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+".json";
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=nm;document.body.appendChild(a);a.click();
    b.textContent="Backup saved. Opening v4…";setTimeout(go,1500);}};
})();
</script></body></html>
